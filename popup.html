
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Form Assistant</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 15px;
      background: #f5f5f5;
    }

    h2 {
      text-align: center;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
    }

    #status, #results {
      margin-top: 15px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .field {
      background: white;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <h2>AI Form Assistant</h2>

  <p>Scan the current website.</p>

  <button id="scanButton">Scan Website</button>

  <button id="copyButton">Copy Questions</button>

  <div id="status">Ready to scan.</div>

  <div id="results"></div>

  <script src="popup.js"></script>
</body>
</html>
