
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal AI Form Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 15px;
      background: #f5f5f5;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h2>AI Form Assistant</h2>

  <p>Scan the current website for form fields.</p>

  <button id="scanButton">Scan Website</button>

  <div id="status">Ready to scan.</div>

  <script src="popup.js"></script>
</body>
</html>
